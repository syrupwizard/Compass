; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather_nrf52840_sense]
platform = nordicnrf52
board = adafruit_feather_nrf52840_sense
framework = arduino
lib_ldf_mode = deep+
build_flags =
	-I"$PROJECT_LIBDEPS_DIR/$PIOENV/Adafruit SPIFlash/src"
	-DUSE_TINYUSB

monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit TinyUSB Library@^3.7.7
	adafruit/SdFat - Adafruit Fork@^2.3.103
	bblanchon/ArduinoJson@^7.2.2
	adafruit/Adafruit SPIFlash@^5.1.1
	adafruit/Adafruit Unified Sensor@^1.1.15
	adafruit/Adafruit Sensor Calibration@^1.1.5
